<!doctype html>
<html lang="es"><head><meta charset="utf-8"><title>RbxUI · vista</title>
<!-- Vista de solo lectura de una escena guardada: /studio/view.html?scene=Nombre. La usa /api/render (PNG para el MCP). -->
<link rel="icon" href="brand/favicon.png">
<link href="https://fonts.googleapis.com/css2?family=Montserrat:ital,wght@0,100..900;1,100..900&family=Inter:wght@100..900&family=Fredoka:wght@300..700&family=Luckiest+Guy&family=Bangers&family=Source+Sans+3:ital,wght@0,200..900;1,200..900&family=Roboto:wght@100..900&family=Roboto+Mono&family=Oswald:wght@200..700&family=Nunito:wght@200..1000&family=Arimo:wght@400..700&family=Press+Start+2P&family=Creepster&family=Denk+One&family=Permanent+Marker&family=Titillium+Web:wght@200..900&family=Ubuntu:wght@300..700&family=Amatic+SC:wght@400;700&family=Jura:wght@300..700&family=Patrick+Hand&family=Kalam&family=Indie+Flower&family=Merriweather&family=Michroma&family=Special+Elite&family=Josefin+Sans&family=Oxanium&family=Comic+Neue&family=Inconsolata&family=Roboto+Condensed&family=Sarpanch&family=Fondamento&family=Grenze+Gotisch&family=Balthazar&display=swap" rel="stylesheet">
<link rel="stylesheet" href="../ds/ds.css">
<style>body { margin: 0; background: #1e1e1e; } #stage { position: relative; overflow: hidden; }</style>
</head><body>
<div class="stage" id="stage"></div>
<script src="rbxjson.js"></script>
<script src="render.js"></script>
<script>
(async () => {
  try {
    const name = new URLSearchParams(location.search).get('scene');
    const [scene, assets] = await Promise.all([
      fetch('/api/scene?name=' + encodeURIComponent(name)).then((r) => { if (!r.ok) throw new Error('no existe la escena ' + name); return r.json(); }),
      fetch('/assets/rbx_assets.json').then((r) => (r.ok ? r.json() : {})).catch(() => ({})),
    ]);
    RBXJson.setAssets(assets);
    if (scene.native) scene.nodes.forEach(function w(n) { if (n.rbxClass) RBXJson.relayout(n); (n.children || []).forEach(w); });
    const st = document.getElementById('stage');
    RBXRender.renderScene(scene, st, { export: true });
    st.style.width = scene.stage.w + 'px'; st.style.height = scene.stage.h + 'px';
    await document.fonts.ready;
    if (scene.native) RBXJson.fitScaled(st);
    await Promise.all([...document.images].map((i) => (i.complete ? 0 : new Promise((r) => { i.onload = i.onerror = r; }))));
    window.__ready = true;
  } catch (e) { window.__error = String(e.message || e); }
})();
</script>
</body></html>
