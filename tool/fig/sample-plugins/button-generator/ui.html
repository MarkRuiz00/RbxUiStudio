<style>
  body { font: 12px Inter, system-ui, sans-serif; margin: 0; padding: 14px; background: #2c2c2c; color: #e6e6e6; }
  label { display: flex; justify-content: space-between; align-items: center; margin-bottom: 10px; gap: 8px; }
  input { background: #383838; border: 1px solid #444; color: inherit; border-radius: 4px; padding: 5px 7px; width: 120px; }
  input[type=color] { padding: 0; height: 26px; }
  .row { display: flex; gap: 8px; margin-top: 14px; }
  button { flex: 1; border: 0; border-radius: 6px; padding: 8px; font-weight: 600; cursor: pointer; }
  #create { background: #0d99ff; color: #fff; } #cancel { background: #444; color: #e6e6e6; }
</style>
<label>Texto <input id="label" value="Comprar"></label>
<label>Color <input id="color" type="color" value="#3ecf4a"></label>
<label>Cantidad <input id="count" type="number" min="1" max="20" value="3"></label>
<label>Radio <input id="radius" type="number" min="0" value="10"></label>
<div class="row"><button id="cancel">Cancelar</button><button id="create">Crear</button></div>
<script>
  const v = (id) => document.getElementById(id).value;
  document.getElementById('create').onclick = () => parent.postMessage({ pluginMessage: { type: 'create', label: v('label'), color: v('color'), count: +v('count') || 1, radius: +v('radius') || 0 } }, '*');
  document.getElementById('cancel').onclick = () => parent.postMessage({ pluginMessage: { type: 'cancel' } }, '*');
</script>
